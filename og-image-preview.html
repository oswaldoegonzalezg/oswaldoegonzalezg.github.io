<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Image Preview — 1200×630</title>
  <style>
    @font-face {
      font-family: 'Hanson';
      src: url('assets/fonts/Hanson-Bold.woff2') format('woff2');
      font-weight: 700;
    }
    @font-face {
      font-family: 'TTCommons';
      src: url('assets/fonts/TT_Commons_Pro_Trial_Regular.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'TTCommons';
      src: url('assets/fonts/TT_Commons_Pro_Trial_ExtraBold.woff2') format('woff2');
      font-weight: 800;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 1200px;
      height: 630px;
      background: #0a0a0a;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .glow-left {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 50%, rgba(232,0,29,0.18) 0, transparent 65%),
        radial-gradient(ellipse 50% 50% at 90% 80%, rgba(232,0,29,0.07) 0, transparent 60%);
    }

    .line-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #e8001d 30%, #e8001d 70%, transparent);
    }

    .line-top {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 0 96px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .label {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .label-line {
      width: 24px;
      height: 2px;
      background: #e8001d;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .label-text {
      font-family: 'TTCommons', sans-serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }

    .name-osvaldo {
      font-family: 'Hanson', sans-serif;
      font-size: 64px;
      color: #ffffff;
      line-height: 0.95;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .name-gonzalez {
      font-family: 'Hanson', sans-serif;
      font-size: 64px;
      color: #e8001d;
      line-height: 0.95;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .subtitle {
      font-family: 'TTCommons', sans-serif;
      font-size: 18px;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.03em;
    }

    .metric-row {
      display: flex;
      align-items: center;
      gap: 16px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 22px;
    }

    .metric-value {
      font-family: 'TTCommons', sans-serif;
      font-size: 30px;
      font-weight: 800;
      color: #ffffff;
    }

    .metric-label {
      font-family: 'TTCommons', sans-serif;
      font-size: 13px;
      font-weight: 400;
      color: rgba(255,255,255,0.38);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .url {
      font-family: 'TTCommons', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="glow-left"></div>
    <div class="line-bottom"></div>
    <div class="line-top"></div>

    <div class="content">
      <div class="label">
        <div class="label-line"></div>
        <span class="label-text">Portafolio profesional</span>
      </div>

      <div>
        <div class="name-osvaldo">OSVALDO</div>
        <div class="name-gonzalez">GONZÁLEZ</div>
      </div>

      <div class="subtitle">Social Media Manager · Bogotá, Colombia</div>

      <div class="metric-row">
        <span class="metric-value">5 años</span>
        <span class="metric-label">de experiencia en marketing digital</span>
      </div>

      <div class="url">oswaldoegonzalezg.vercel.app</div>
    </div>
  </div>
</body>
</html>
